<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GDG Bulk Certificate Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>GDG Bulk Certificate Generator</h1>

    <div class="container">

        <div class="controls">

            <h2>Certificate Settings</h2>

            <label>Upload Certificate Template</label>
            <input type="file" id="templateInput" accept="image/*">

            <br><br>

            <label>Upload Names File</label>
            <input type="file" id="namesInput" accept=".csv,.xlsx,.xls">
            <div id="namesList"></div>
            <label>Select Participant</label>

            <select id="nameSelect">
            <option value="">Select a name</option>
            </select>

            <br><br>

            <label>Name Font Size</label>
            <input type="number" id="fontSize" value="40">

            <br><br>

            <label>Name Color</label>
            <input type="color" id="fontColor" value="#000000">

            <br><br>
            <label>Name Position (Left / Right)</label>
            <input type="range" id="nameX" min="10" max="90" value="50">

            <label>Name Position (Up / Down)</label>
            <input type="range" id="nameY" min="10" max="90" value="50">

            <button id="downloadBtn">Download Certificate</button>
            <br><br>
            <button id="bulkDownloadBtn">Generate Bulk Certificates</button>
            <br><br>
            <button id="pdfDownloadBtn">Download Combined PDF</button>

        </div>


        <div class="preview">

            <h2>Certificate Preview</h2>

            <div id="certificate">

                <img id="template" src="" alt="Certificate">

                <div id="name">Your Name</div>

            </div>

        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
